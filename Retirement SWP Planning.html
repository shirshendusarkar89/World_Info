<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retirement & SWP Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #eef4ff; 
            margin: 0; 
            padding: 6px; 
            color: #333;
        }
        .card { 
            max-width: 100%; 
            margin: auto; 
            background: #fff; 
            padding: 12px; 
            border-radius: 10px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
        }
        .dashboard-grid { 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
        }
        .panel { 
            padding: 4px; 
        }
        .row { 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
            margin-bottom: 12px; 
        }
        .row label {
            font-size: 0.8rem;
            font-weight: bold;
            color: #475569;
        }
        .row-inputs {
            display: grid;
            grid-template-columns: 1fr 90px;
            gap: 8px;
            align-items: center;
        }
        .row-static { 
            margin: 12px 0; 
        }
        input[type=range] { 
            width: 100%; 
            height: 6px;
            accent-color: #2563eb;
            cursor: pointer;
            margin-top: 4px;
        }
        input[type=number] { 
            width: 100%; 
            padding: 6px 8px; 
            font-size: 0.95rem; 
            border: 1px solid #cbd5e1; 
            border-radius: 5px; 
            background: #f8fafc; 
            font-weight: bold; 
            color: #0f172a; 
        }
        .out { 
            font-size: 1.2rem; 
            font-weight: 900; 
            color: #059669; 
        }
        .highlight { 
            font-size: 1.1rem; 
            color: #dc2626; 
            font-weight: bold; 
        }
        button { 
            width: 100%;
            padding: 12px; 
            cursor: pointer; 
            margin-top: 15px; 
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
        }
        h3 { 
            border-bottom: 2px solid #f1f5f9; 
            padding-bottom: 8px; 
            margin-top: 0; 
            color: #1e3a8a;
            font-size: 1rem;
        }
        canvas { 
            max-height: 220px; 
            width: 100% !important;
            margin: 10px 0; 
        }
        .result-box {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 10px;
            border-radius: 6px;
            margin: 12px 0;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="dashboard-grid">
        <!-- Retirement Planning Panel -->
        <div class="panel">
            <h3>Building of Retirement Corpus with SIP</h3>
            <div class="row"><label>Inflation Rate (%)</label><div class="row-inputs"><input id="rInf" type="range" min="0" max="15" step=".1" value="6"><input id="nInf" type="number" step=".1" value="6"></div></div>
            <div class="row"><label>Present Age</label><div class="row-inputs"><input id="rAge" type="range" min="18" max="60" step="1" value="25"><input id="nAge" type="number" step="1" value="25"></div></div>
            <div class="row"><label>Retirement Age</label><div class="row-inputs"><input id="rRet" type="range" min="40" max="80" step="1" value="55"><input id="nRet" type="number" step="1" value="55"></div></div>
            <div class="row"><label>Monthly SIP (₹)</label><div class="row-inputs"><input id="rSIP" type="range" min="1000" max="500000" step="1000" value="20000"><input id="nSIP" type="number" step="1000" value="20000"></div></div>
            <div class="row"><label>SIP Return Rate (%)</label><div class="row-inputs"><input id="rSIPR" type="range" min="0" max="25" step=".1" value="12"><input id="nSIPR" type="number" step=".1" value="12"></div></div>
            <div style="margin: 10px 0;"><label style="font-size:0.8rem; font-weight:bold; color:#475569;">Corpus at Retirement:</label><span id="corpusOut" class="out">₹0</span></div>
            <canvas id="accChart"></canvas>
        </div>

        <!-- SWP Control Panel -->
        <div class="panel">
            <h3>SWP Control Panel</h3>
            <div class="row"><label>Annual Return (%)</label><div class="row-inputs"><input id="rR" type="range" min="0" max="30" step=".1" value="12"><input id="nR" type="number" step=".1" value="12"></div></div>
            <div class="row"><label>Required Inflation Adjusted Futuristic Monthly SWP(₹)</label><div class="row-inputs"><input id="rS" type="range" min="10000" max="1000000" step="5000" value="172305"><input id="nS" type="number" step="5000" value="172305"></div></div>
            
            <!-- Present Value Display Box -->
            <div class="result-box">
                <label style="color: #475569; margin-bottom: 2px; font-size: 0.8rem;">Present Value of the Futuristic Monthly SWP(₹):</label><br>
                <span id="inflatedSwp" class="highlight">₹0</span>
            </div>

            <!-- Initial Investment (Non-variable, linked to Corpus at Retirement) -->
            <div class="row-static"><label style="font-size: 0.8rem; font-weight: bold; color: #475569;">Initial Investment (₹)</label><span id="initialInvestmentOut" class="out" style="font-size: 1.1rem; color: #1e3a8a;">₹0</span></div>

            <div class="row"><label>Years Passed</label><div class="row-inputs"><input id="rY" type="range" min="0" max="50" step="1" value="10"><input id="nY" type="number" step="1" value="10"></div></div>
            <div style="margin: 10px 0;"><label style="font-size: 0.8rem; font-weight: bold; color: #475569;">Balance Portfolio Value</label><div id="port" class="out">₹0</div></div>
            <div id="status" style="font-weight: bold; margin: 6px 0; font-size: 0.9rem;"></div>
            <canvas id="swpChart"></canvas>
        </div>
    </div>
    <button onclick="resetAll()">Reset All Settings</button>
</div>

<script>
let charts = {acc: null, swp: null};

// Input Sync
const inputs = [
    {r: 'rInf', n: 'nInf'}, {r: 'rAge', n: 'nAge'}, {r: 'rRet', n: 'nRet'}, 
    {r: 'rSIP', n: 'nSIP'}, {r: 'rSIPR', n: 'nSIPR'},
    {r: 'rR', n: 'nR'}, {r: 'rS', n: 'nS'}, {r: 'rY', n: 'nY'}
];

inputs.forEach(x=>{
 let r=document.getElementById(x.r), n=document.getElementById(x.n);
 r.oninput=()=>{n.value=r.value; updateAll()}; 
 n.oninput=()=>{r.value=n.value; updateAll()};
});

function fmt(v){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(v);}

function updateCharts() {
    // 1. Accumulation Phase Logic
    let pAge = +nAge.value, rAge = +nRet.value, years = rAge - pAge;
    let accLabels = Array.from({length: years + 1}, (_, i) => pAge + i);
    let accData = [];
    let sip = +nSIP.value, r = (+nSIPR.value / 100) / 12, cur = 0;
    
    for (let i = 0; i <= years; i++) {
        accData.push(Math.round(cur));
        for(let m=0; m<12; m++) cur = (cur + sip) * (1 + r);
    }
    
    let retirementCorpus = accData[years];
    corpusOut.textContent = fmt(retirementCorpus);
    initialInvestmentOut.textContent = fmt(retirementCorpus);

    // 2. Present Value Calculation from Futuristic SWP Logic
    let yearsToRetirement = rAge - pAge;
    let infRate = +nInf.value / 100;
    let futuristicSwp = +nS.value;
    let presentValueSwp = futuristicSwp / Math.pow((1 + infRate), yearsToRetirement);
    inflatedSwp.textContent = fmt(presentValueSwp);

    // 3. SWP Depletion Logic using Retirement Corpus as Initial Investment
    let sYears = +nY.value;
    let swpLabels = Array.from({length: sYears + 1}, (_, i) => i);
    let swpData = [];
    let p = retirementCorpus, ar = (+nR.value / 100) / 12, s = futuristicSwp;
    
    for (let i = 0; i <= sYears; i++) {
        swpData.push(Math.round(p));
        for(let m=0; m<12; m++) { p = p * (1 + ar) - s; if(p<0) p=0; }
    }

    // Charting
    if(charts.acc) charts.acc.destroy();
    charts.acc = new Chart(document.getElementById('accChart'), {
        type: 'line', data: { labels: accLabels, datasets: [{ label: 'Corpus Growth', data: accData, borderColor: '#007bff', fill: true }] },
        options: { responsive: true, plugins: { title: { display: true, text: 'Accumulation Projection' } } }
    });

    if(charts.swp) charts.swp.destroy();
    charts.swp = new Chart(document.getElementById('swpChart'), {
        type: 'line', data: { labels: swpLabels, datasets: [{ label: 'Portfolio Balance', data: swpData, borderColor: '#dc3545', fill: true }] },
        options: { responsive: true, plugins: { title: { display: true, text: 'SWP Depletion' } } }
    });

    port.textContent = fmt(p);
    status.textContent = p > 0 ? "Status: Portfolio Active" : "Status: Portfolio Exhausted";
    port.style.color = p > 0 ? "#059669" : "#dc2626";
}

function updateAll(){ updateCharts(); }

function resetAll(){
    nInf.value=rInf.value=6; nAge.value=rAge.value=25; nRet.value=rRet.value=55;
    nSIP.value=rSIP.value=20000; nSIPR.value=rSIPR.value=12;
    nR.value=rR.value=12; nS.value=rS.value=172305; nY.value=rY.value=10;
    updateAll();
}

updateAll();
</script>
</body>
</html>
