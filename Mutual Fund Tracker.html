<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mutual Fund Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* CSS Reset for precise spacing control */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Aptos', 'Aptos Display', 'Segoe UI', Tahoma, Geneva, sans-serif; 
            background-color: #f4f7f6; 
            color: #333; 
            display: flex;
            justify-content: center;
            padding: 8px;
            height: 100vh;
            overflow: hidden; /* Prevents scrolling */
        }
        
        .container { 
            width: 100%;
            max-width: 1000px; 
            background: white; 
            padding: 10px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            display: flex;
            flex-direction: column;
        }

        h2 { 
            font-size: 16px; 
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }
        
        /* Compact Flexbox layout for controls */
        .controls {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        
        /* Normalized font sizes for ALL dropdowns and buttons */
        select, button {
            font-family: inherit;
            font-size: 13px;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: white;
            outline: none;
            max-width: 100%;
            text-overflow: ellipsis; /* Prevents dropdown from stretching screen */
        }

        .controls select {
            flex: 1;
            min-width: calc(50% - 3px); 
        }

        .controls button {
            flex: 1;
            min-width: 100%; 
            background-color: #1565c0;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            padding: 8px;
        }

        .controls button:hover { background-color: #0d47a1; }
        
        #fundSelect { 
            width: 100%; 
            margin-bottom: 8px; 
            display: none; 
        }
        
        /* Highly compact NAV display card */
        .nav-display { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #e3f2fd; 
            padding: 8px 10px; 
            border-radius: 6px; 
            margin-bottom: 8px; 
        }
        .nav-display div:first-child {
            flex: 1;
            padding-right: 8px;
        }
        #fundName {
            font-size: 12px;
            margin-bottom: 3px;
            white-space: normal; /* Allows long fund names to wrap instead of pushing out of screen */
            word-wrap: break-word;
            line-height: 1.2;
        }
        #fundDate { color: #666; font-size: 10px; }
        .nav-value { 
            font-size: 16px; 
            font-weight: bold; 
            color: #1565c0; 
            white-space: nowrap;
        }

        /* Slider Controls */
        .slider-container {
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }
        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
        }
        #sliderLabelText {
            min-width: 45px;
            text-align: right;
            color: #1565c0;
        }
        
        /* Chart container constrained to fit remaining screen space */
        .chart-container {
            position: relative;
            flex: 1; 
            min-height: 180px;
            max-height: 50vh; 
            width: 100%;
        }
        
        .message { 
            display: none; 
            font-size: 12px;
            color: #d32f2f; 
            font-weight: bold; 
            text-align: center;
            margin-bottom: 8px;
        }

        @media (min-width: 600px) {
            .controls select { min-width: auto; }
            .controls button { min-width: auto; }
            .chart-container { max-height: 60vh; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Mutual Fund Tracker</h2>

        <!-- Institution & Category Controls -->
        <div class="controls">
            <select id="instSelect">
                <option value="SBI">SBI Mutual Fund</option>
                <option value="HDFC">HDFC Mutual Fund</option>
                <option value="Axis">Axis Mutual Fund</option>
                <option value="ICICI">ICICI Prudential</option>
                <option value="Nippon">Nippon India</option>
                <option value="Kotak">Kotak Mahindra</option>
                <option value="Tata">Tata Mutual Fund</option>
            </select>
            
            <select id="catSelect">
                <option value="Equity">Equity</option>
                <option value="Debt">Debt</option>
                <option value="Liquid">Liquid</option>
                <option value="Hybrid">Hybrid</option>
                <option value="Large Cap">Large Cap</option>
                <option value="Midcap">Midcap</option>
                <option value="Small Cap">Small Cap</option>
                <option value="Index">Index</option>
                <option value="ETF">ETF</option>
            </select>
            
            <button onclick="searchAPI()">Search</button>
        </div>

        <div id="statusMessage" class="message">Working... Please wait.</div>

        <select id="fundSelect" onchange="fetchFundData()">
            <option value="">-- Select a Fund --</option>
        </select>

        <!-- Dynamic NAV Display -->
        <div class="nav-display" id="navDisplay" style="display: none;">
            <div>
                <h3 id="fundName">Fund Name</h3>
                <span id="fundDate">Date</span>
            </div>
            <div class="nav-value">₹<span id="latestNav">0.00</span></div>
        </div>

        <!-- Period Slider -->
        <div class="slider-container" id="sliderContainer">
            <label for="yearSlider">Trend:</label>
            <input type="range" id="yearSlider" min="1" max="25" value="25" oninput="updateSliderLabel()" onchange="updateChartRange()">
            <span id="sliderLabelText"><span id="sliderLabel">Max</span> Yrs</span>
        </div>

        <!-- Scaled Chart Area -->
        <div class="chart-container">
            <canvas id="navChart"></canvas>
        </div>
    </div>

    <script>
        let chartInstance = null;
        let globalFundData = []; // Store raw data for instant slider filtering

        function showMessage(msg, color = '#d32f2f') {
            const el = document.getElementById('statusMessage');
            el.style.display = 'block';
            el.style.color = color;
            el.textContent = msg;
        }

        function hideMessage() {
            document.getElementById('statusMessage').style.display = 'none';
        }

        async function searchAPI() {
            const inst = document.getElementById('instSelect').value;
            const cat = document.getElementById('catSelect').value;
            const query = `${inst} ${cat}`;

            showMessage('Searching database...', '#1565c0');
            const select = document.getElementById('fundSelect');
            select.style.display = 'none';
            document.getElementById('navDisplay').style.display = 'none';
            document.getElementById('sliderContainer').style.display = 'none';

            if(chartInstance) chartInstance.destroy();

            try {
                const response = await fetch(`https://api.mfapi.in/mf/search?q=${encodeURIComponent(query)}`);
                const funds = await response.json();
                
                hideMessage();

                if (funds.length === 0) {
                    showMessage('No funds found for this combination.');
                    return;
                }

                select.innerHTML = '<option value="">-- Select a Fund from Results --</option>';
                funds.forEach(fund => {
                    const option = document.createElement('option');
                    option.value = fund.schemeCode;
                    option.textContent = fund.schemeName;
                    select.appendChild(option);
                });
                
                select.style.display = 'block'; 

            } catch (error) {
                showMessage('Error connecting to the API.');
            }
        }

        async function fetchFundData() {
            const schemeCode = document.getElementById('fundSelect').value;
            if (!schemeCode) return;

            showMessage('Fetching timeline data...', '#1565c0');
            document.getElementById('navDisplay').style.display = 'none';
            document.getElementById('sliderContainer').style.display = 'none';

            try {
                const response = await fetch(`https://api.mfapi.in/mf/${schemeCode}`);
                const result = await response.json();

                hideMessage();

                if (result.status === "SUCCESS") {
                    const meta = result.meta;
                    // Reverse once and store globally for the slider to reuse
                    globalFundData = result.data.reverse(); 

                    const latest = globalFundData[globalFundData.length - 1];
                    document.getElementById('fundName').textContent = meta.scheme_name;
                    document.getElementById('fundDate').textContent = 'Latest NAV as of: ' + latest.date;
                    document.getElementById('latestNav').textContent = parseFloat(latest.nav).toFixed(4);
                    document.getElementById('navDisplay').style.display = 'flex';
                    
                    // Reset and show slider
                    const slider = document.getElementById('yearSlider');
                    slider.value = 25; 
                    updateSliderLabel();
                    document.getElementById('sliderContainer').style.display = 'flex';

                    updateChartRange(); // Initial render with Max range
                }
            } catch (error) {
                showMessage('Failed to fetch historical data.');
            }
        }

        // Helper to convert API DD-MM-YYYY to JS Date object
        function parseDate(dateStr) {
            const parts = dateStr.split('-');
            return new Date(parts[2], parts[1] - 1, parts[0]);
        }

        // Updates text readout when sliding
        function updateSliderLabel() {
            const val = document.getElementById('yearSlider').value;
            const max = document.getElementById('yearSlider').max;
            document.getElementById('sliderLabel').textContent = (val == max) ? "Max" : val;
        }

        // Filters stored data based on slider year offset and renders chart
        function updateChartRange() {
            const yearsToKeep = document.getElementById('yearSlider').value;
            const max = document.getElementById('yearSlider').max;
            
            if (globalFundData.length === 0) return;

            let filteredData = globalFundData;
            
            if (yearsToKeep != max) {
                const latestDateStr = globalFundData[globalFundData.length - 1].date;
                const latestDate = parseDate(latestDateStr);
                
                // Calculate minimum date by subtracting selected years
                const cutoffDate = new Date(latestDate);
                cutoffDate.setFullYear(latestDate.getFullYear() - parseInt(yearsToKeep));
                
                filteredData = globalFundData.filter(item => {
                    return parseDate(item.date) >= cutoffDate;
                });
                
                // Fallback if fund is newer than requested range
                if(filteredData.length === 0) {
                    filteredData = globalFundData;
                }
            }
            
            renderChart(filteredData);
        }

        function renderChart(dataToRender) {
            const ctx = document.getElementById('navChart').getContext('2d');

            const labels = dataToRender.map(item => item.date);
            const values = dataToRender.map(item => parseFloat(item.nav));

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'NAV Trend',
                        data: values,
                        borderColor: '#1565c0',
                        borderWidth: 2,
                        pointRadius: 0, 
                        fill: true,
                        backgroundColor: 'rgba(21, 101, 192, 0.1)',
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false, 
                    interaction: {
                        intersect: false,
                        mode: 'index',
                    },
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            ticks: {
                                maxTicksLimit: 6,
                                font: { size: 10 }
                            }
                        },
                        y: {
                            ticks: {
                                font: { size: 10 }
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
