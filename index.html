<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Information Centre</title>

<style>
    :root{
        --primary:#1e3a8a;
        --accent:#2563eb;
        --background:#f1f5f9;
        --panel:#ffffff;
        --text:#0f172a;
        --muted:#64748b;
        --border:#cbd5e1;
    }

    *{box-sizing:border-box}

    html,body{
        width:100%;
        height:100%;
        margin:0;
    }

    body{
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
        background:
            radial-gradient(circle at 15% 10%,rgba(37,99,235,.10),transparent 30%),
            radial-gradient(circle at 85% 20%,rgba(14,165,233,.10),transparent 30%),
            var(--background);
        color:var(--text);
        overflow:hidden;
    }

    .master{
        width:100%;
        height:100vh;
        display:flex;
        flex-direction:column;
        padding:10px;
    }

    .header{
        flex:0 0 auto;
        background:linear-gradient(135deg,#0f172a,#1e3a8a 55%,#2563eb);
        color:#fff;
        border-radius:14px;
        padding:12px 16px;
        box-shadow:0 8px 24px rgba(15,23,42,.18);
        position:relative;
        overflow:hidden;
    }

    .header:after{
        content:"";
        position:absolute;
        width:180px;
        height:180px;
        right:-60px;
        top:-90px;
        border-radius:50%;
        background:rgba(255,255,255,.08);
    }

    .title{
        margin:0;
        text-align:center;
        font-size:clamp(1.05rem,2.5vw,1.55rem);
        font-weight:850;
        letter-spacing:.3px;
    }

    .subtitle{
        margin:3px 0 0;
        text-align:center;
        font-size:.72rem;
        opacity:.82;
        letter-spacing:.25px;
    }

    .module-bar{
        flex:0 0 auto;
        display:grid;
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:8px;
        padding:9px 0;
    }

    .module-btn{
        flex:1;
        min-height:44px;
        border:1px solid var(--border);
        border-radius:10px;
        background:#fff;
        color:#334155;
        font-size:.82rem;
        font-weight:800;
        cursor:pointer;
        box-shadow:0 2px 6px rgba(15,23,42,.06);
        transition:.18s ease;
    }

    .module-btn:hover{
        transform:translateY(-1px);
        box-shadow:0 5px 12px rgba(15,23,42,.10);
    }

    .module-btn.active{
        color:#fff;
        border-color:#1e40af;
        background:linear-gradient(135deg,#1e3a8a,#2563eb);
        box-shadow:0 5px 14px rgba(37,99,235,.25);
    }

    .workspace{
        position:relative;
        flex:1 1 auto;
        min-height:0;
        background:#fff;
        border:1px solid var(--border);
        border-radius:12px;
        overflow:hidden;
        box-shadow:0 4px 16px rgba(15,23,42,.08);
    }

    #moduleFrame{
        width:100%;
        height:100%;
        border:0;
        display:block;
        background:#fff;
    }

    .welcome{
        position:absolute;
        inset:0;
        display:flex;
        align-items:center;
        justify-content:center;
        text-align:center;
        padding:25px;
        background:
            linear-gradient(rgba(255,255,255,.96),rgba(248,250,252,.96));
        z-index:2;
    }

    .welcome-card{
        width:min(560px,94%);
        padding:30px 24px;
        border:1px solid var(--border);
        border-radius:18px;
        background:#fff;
        box-shadow:0 12px 35px rgba(15,23,42,.10);
    }

    .welcome-icon{
        font-size:3rem;
        margin-bottom:8px;
    }

    .welcome h2{
        margin:0 0 7px;
        color:var(--primary);
        font-size:1.25rem;
    }

    .welcome p{
        margin:0;
        color:var(--muted);
        font-size:.82rem;
        line-height:1.5;
    }

    .status{
        flex:0 0 auto;
        text-align:center;
        color:var(--muted);
        font-size:.64rem;
        padding:5px 0 0;
    }

    .loading{
        position:absolute;
        inset:0;
        display:none;
        align-items:center;
        justify-content:center;
        background:rgba(248,250,252,.72);
        backdrop-filter:blur(2px);
        z-index:3;
        color:var(--primary);
        font-size:.82rem;
        font-weight:800;
    }

    .loading.visible{display:flex}

    @media(max-width:600px){
        .master{padding:6px}
        .header{padding:10px}
        .module-bar{
            grid-template-columns:1fr;
            gap:5px;
            padding:6px 0;
        }
        .module-btn{font-size:.72rem;min-height:40px}
        .status{font-size:.58rem}
    }
</style>
</head>

<body>
<div class="master">

    <header class="header">
        <h1 class="title">GLOBAL INFORMATION CENTRE</h1>
        <p class="subtitle">Select an information module to continue</p>
    </header>

    <nav class="module-bar" aria-label="Information modules">
        <button class="module-btn" id="worldBtn"
                onclick="openModule('World_Info.html','worldBtn','🌍 World Information')">
            🌍 WORLD INFORMATION
        </button>

        <button class="module-btn" id="indiaBtn"
                onclick="openModule('India_Info.html','indiaBtn','🇮🇳 India Information')">
            🇮🇳 INDIA INFORMATION
        </button>

        <button class="module-btn" id="radioBtn"
                onclick="openModule('World_Radio.html','radioBtn','📻 World Radio')">
            📻 WORLD RADIO
        </button>
    </nav>

    <main class="workspace">
        <div class="welcome" id="welcome">
            <div class="welcome-card">
                <div class="welcome-icon">🌐</div>
                <h2>Welcome to Global Information Centre</h2>
                <p>
                    Choose <strong>World Information</strong>,
                    <strong>India Information</strong>, or
                    <strong>World Radio</strong> above.
                    The selected application will open inside this master panel.
                </p>
            </div>
        </div>

        <div class="loading" id="loading">Loading module…</div>

        <iframe
            id="moduleFrame"
            title="Selected Information Module"
            src="about:blank">
        </iframe>
    </main>

    <div class="status" id="status">
        No module selected
    </div>
</div>

<script>
    const frame = document.getElementById("moduleFrame");
    const welcome = document.getElementById("welcome");
    const loading = document.getElementById("loading");
    const status = document.getElementById("status");

    function openModule(file, buttonId, label){
        document.querySelectorAll(".module-btn")
            .forEach(btn => btn.classList.remove("active"));

        document.getElementById(buttonId).classList.add("active");

        welcome.style.display = "none";
        loading.classList.add("visible");
        status.textContent = "Loading: " + label;

        frame.onload = function(){
            loading.classList.remove("visible");
            status.textContent = label + " — Module loaded";
        };

        frame.onerror = function(){
            loading.classList.remove("visible");
            status.textContent = "Unable to load " + label;
        };

        frame.src = file;
    }
</script>
</body>
</html>
